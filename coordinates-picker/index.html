<!DOCTYPE html>
<html>
<head>
  <title>Coordinates Picker</title>

  <script src="https://cuttle.xyz/editor/customizer/v1.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      color: #222;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .search {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      padding: 8px 12px;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      font-size: 12px;
      color: #666;
      margin: 8px 0;
      min-height: 16px;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .result {
      text-align: left;
      background: #f2f2f2;
      color: #222;
      width: 100%;
    }

    .result:hover {
      background: #ddd;
    }

    #map {
      width: 100%;
      height: 300px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }

    .coordinates {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    #save {
      margin-top: 15px;
      width: 100%;
    }

    .attribution {
      margin-top: 8px;
      font-size: 10px;
      color: #777;
    }
  </style>
</head>

<body>

  <label for="query">Place</label>

  <div class="search">
    <input
      id="query"
      type="text"
      placeholder="Search for a place..."
      autocomplete="off"
    >
    <button id="search">Search</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <div id="map"></div>

  <div
    id="coordinates"
    class="coordinates"
    style="display:none"
  ></div>

  <button id="save">Save</button>

  <div class="attribution">
    Map © OpenStreetMap contributors · Leaflet
  </div>


<script>

  let map = null;
  let marker = null;

  // Full-precision authoritative coordinates.
  let latitude = null;
  let longitude = null;


  const $ = id =>
    document.getElementById(id);


  /*
   * Convert decimal degrees to DMS.
   *
   * Seconds are rounded to whole numbers.
   */
  function decimalToDMS(
    value,
    positive,
    negative
  ) {

    const direction =
      value >= 0
        ? positive
        : negative;

    const absolute =
      Math.abs(value);

    let degrees =
      Math.floor(absolute);

    const minutesFloat =
      (absolute - degrees) * 60;

    let minutes =
      Math.floor(minutesFloat);

    let seconds =
      Math.round(
        (minutesFloat - minutes) * 60
      );


    /*
     * Carry 60 seconds into minutes.
     */
    if (seconds === 60) {

      seconds = 0;
      minutes++;

      if (minutes === 60) {
        minutes = 0;
        degrees++;
      }
    }


    return {
      direction,
      degrees,
      minutes,
      seconds
    };
  }


  function formatCoordinate(
    value,
    positive,
    negative
  ) {

    const dms =
      decimalToDMS(
        value,
        positive,
        negative
      );

    return (
      `${dms.direction} ` +
      `${dms.degrees}° ` +
      `${dms.minutes}' ` +
      `${dms.seconds}"`
    );
  }


  /*
   * Update the visible coordinate readout.
   */
  function updateCoordinateDisplay() {

    if (
      latitude === null ||
      longitude === null
    ) {
      $("coordinates").style.display =
        "none";

      return;
    }


    $("coordinates").style.display =
      "block";


    $("coordinates").innerHTML =
      `<div>Latitude: ` +
      `${formatCoordinate(
        latitude,
        "N",
        "S"
      )}</div>` +

      `<div>Longitude: ` +
      `${formatCoordinate(
        longitude,
        "E",
        "W"
      )}</div>`;
  }


  /*
   * Create the Leaflet map on first use.
   */
  function ensureMap() {

    if (map) return;


    $("map").style.display =
      "block";


    map = L.map("map");


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,

        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    /*
     * Clicking anywhere on the map
     * moves the marker there.
     */
    map.on("click", event => {

      setLocation(
        event.latlng.lat,
        event.latlng.lng,
        false
      );
    });
  }


  /*
   * Set the authoritative decimal coordinates.
   */
  function setLocation(
    lat,
    lon,
    moveMap = true
  ) {

    latitude = Number(lat);
    longitude = Number(lon);


    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {
      return;
    }


    ensureMap();


    const position = [
      latitude,
      longitude
    ];


    if (!marker) {

      marker =
        L.marker(position, {
          draggable: true
        }).addTo(map);


      marker.on(
        "dragend",
        () => {

          const position =
            marker.getLatLng();


          latitude =
            position.lat;

          longitude =
            position.lng;


          updateCoordinateDisplay();


          $("status").textContent =
            "Drag the marker to fine-tune the location.";
        }
      );

    } else {

      marker.setLatLng(position);
    }


    if (moveMap) {

      map.setView(
        position,
        16
      );
    }


    updateCoordinateDisplay();
  }


  /*
   * Search OpenStreetMap / Nominatim.
   */
  async function searchPlaces() {

    const query =
      $("query").value.trim();


    if (!query) return;


    $("search").disabled =
      true;

    $("status").textContent =
      "Searching...";

    $("results").replaceChildren();


    try {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({
          q: query,
          format: "jsonv2",
          limit: "5",
          addressdetails: "1"
        });


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );
      }


      const places =
        await response.json();


      if (!places.length) {

        $("status").textContent =
          "No places found.";

        return;
      }


      $("status").textContent =
        `${places.length} result` +
        `${places.length === 1 ? "" : "s"}:`;


      for (const place of places) {

        const button =
          document.createElement("button");


        button.className =
          "result";

        button.textContent =
          place.display_name;


        button.onclick = () => {

          const lat =
            Number(place.lat);

          const lon =
            Number(place.lon);


          $("query").value =
            query;


          setLocation(
            lat,
            lon,
            true
          );


          $("results")
            .replaceChildren();


          $("status").textContent =
            "Drag the marker to fine-tune the location.";
        };


        $("results")
          .appendChild(button);
      }


    } catch (error) {

      console.error(error);


      $("status").textContent =
        "Search failed. Please try again.";

    } finally {

      $("search").disabled =
        false;
    }
  }


  /*
   * Restore the plugin from the Cuttle value.
   *
   * latitude and longitude are the ONLY inputs
   * used to restore the map.
   */
  cuttle.ready(value => {

    if (!value) return;


    $("query").value =
      value.query ?? "";


    const lat =
      Number(value.latitude);

    const lon =
      Number(value.longitude);


    if (
      Number.isFinite(lat) &&
      Number.isFinite(lon)
    ) {

      /*
       * Wait until the plugin has rendered before
       * initializing Leaflet.
       */
      setTimeout(() => {

        setLocation(
          lat,
          lon,
          true
        );


        map.invalidateSize();


        $("status").textContent =
          "Drag the marker to fine-tune the location.";

      }, 0);
    }
  });


  /*
   * Search button.
   */
  $("search").onclick =
    searchPlaces;


  /*
   * Enter in search field.
   */
  $("query").addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        searchPlaces();
      }
    }
  );


  /*
   * Render a static 4:3 OpenStreetMap image centered on the marker by
   * stitching tiles onto a canvas. Returns a JPEG data URL, or undefined if
   * any tile fails to load.
   */
  async function renderPreviewImage(lat, lon) {

    const width = 320;
    const height = 240;
    const zoom = 16;
    const tileSize = 256;
    const worldSize = tileSize * 2 ** zoom;

    const latRadians = lat * Math.PI / 180;

    const centerX =
      (lon + 180) / 360 * worldSize;

    const centerY =
      (1 - Math.log(Math.tan(latRadians) + 1 / Math.cos(latRadians)) / Math.PI) /
      2 * worldSize;

    const left = centerX - width / 2;
    const top = centerY - height / 2;

    const tileCount = 2 ** zoom;

    const loadTile = (x, y) =>
      new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src =
          `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
      });

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d");

    const tileRequests = [];

    for (
      let tileY = Math.floor(top / tileSize);
      tileY <= Math.floor((top + height) / tileSize);
      tileY++
    ) {
      for (
        let tileX = Math.floor(left / tileSize);
        tileX <= Math.floor((left + width) / tileSize);
        tileX++
      ) {

        // Wrap horizontally across the antimeridian; skip beyond the poles.
        const wrappedX = ((tileX % tileCount) + tileCount) % tileCount;
        if (tileY < 0 || tileY >= tileCount) continue;

        tileRequests.push(
          loadTile(wrappedX, tileY).then(image => {
            context.drawImage(
              image,
              tileX * tileSize - left,
              tileY * tileSize - top
            );
          })
        );
      }
    }

    try {
      await Promise.all(tileRequests);
    } catch (error) {
      console.error(error);
      return undefined;
    }

    // Marker.
    const markerX = width / 2;
    const markerY = height / 2;
    context.beginPath();
    context.arc(markerX, markerY, 8, 0, Math.PI * 2);
    context.fillStyle = "#e53935";
    context.fill();
    context.lineWidth = 3;
    context.strokeStyle = "white";
    context.stroke();

    // Attribution.
    const attribution = "© OpenStreetMap contributors";
    context.font = "10px system-ui, sans-serif";
    const attributionWidth = context.measureText(attribution).width + 8;
    context.fillStyle = "rgba(255, 255, 255, 0.8)";
    context.fillRect(width - attributionWidth, height - 14, attributionWidth, 14);
    context.fillStyle = "#333";
    context.fillText(attribution, width - attributionWidth + 4, height - 4);

    return canvas.toDataURL("image/jpeg", 0.8);
  }


  /*
   * Save.
   */
  $("save").onclick = async () => {

    if (
      latitude === null ||
      longitude === null
    ) {

      $("status").textContent =
        "Please search for a place or choose a location on the map.";

      return;
    }


    /*
     * Generate DMS only for the output fields.
     * The decimal values remain full precision.
     */
    const lat =
      decimalToDMS(
        latitude,
        "N",
        "S"
      );


    const lon =
      decimalToDMS(
        longitude,
        "E",
        "W"
      );


    const value = {

      query:
        $("query").value,


      /*
       * Authoritative coordinates.
       */
      latitude:
        latitude,

      longitude:
        longitude,


      /*
       * DMS representation.
       */
      direction1:
        lat.direction,

      degrees1:
        `${lat.degrees} °`,

      minsec1:
        `${lat.minutes}' ${lat.seconds}"`,


      direction2:
        lon.direction,

      degrees2:
        `${lon.degrees} °`,

      minsec2:
        `${lon.minutes}' ${lon.seconds}"`,


      _previewText:
        `${formatCoordinate(latitude, "N", "S")}, ` +
        `${formatCoordinate(longitude, "E", "W")}`
    };


    $("save").disabled = true;
    $("status").textContent = "Rendering preview...";

    const previewImage = await renderPreviewImage(latitude, longitude);
    if (previewImage) value._previewImage = previewImage;

    $("save").disabled = false;

    cuttle.setValueAndClose(value);
  };

</script>

</body>
</html>
