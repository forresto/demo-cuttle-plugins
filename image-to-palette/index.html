<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image to Palette</title>
    <script src="https://cuttle.xyz/editor/customizer/v1.js"></script>
    <style>
      /* Cuttle plugin style (2026-09-25), only the parts this plugin uses. */
      :root {
        --bg: #fafafa;
        --panel: #f3f3f3;
        --field: #e6e6e6;
        --field-h: #dedede;
        --ink: rgba(0, 0, 0, 0.85);
        --ink2: rgba(0, 0, 0, 0.5);
        --line: rgba(0, 0, 0, 0.1);
        --blue: hsl(200, 100%, 50%);
        --blue-h: hsl(200, 100%, 58%);
        --error: hsl(0, 70%, 92%);
        --error-ink: hsl(12, 68%, 40%);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }

      .layout {
        display: grid;
        gap: 12px;
        align-items: start;
      }
      @media (min-width: 640px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      @media (min-width: 1000px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) 420px;
        }
      }

      .preview {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 4/3;
        min-height: 200px;
        max-height: calc(100vh - 24px);
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--line),
          0 4px 16px rgba(0, 0, 0, 0.08);
        background: #fff;
      }
      /* After the base .preview rule, or position: relative wins. */
      @media (min-width: 640px) {
        .preview {
          position: sticky;
          top: 12px;
        }
      }
      /* Plugin-specific: the source image fills the preview card. */
      .preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .empty {
        color: var(--ink2);
        text-align: center;
        padding: 24px;
      }
      .preview[aria-busy="true"] {
        opacity: 0.6;
      }

      form {
        display: grid;
        gap: 12px;
      }
      .panel {
        display: grid;
        gap: 8px;
        background: var(--panel);
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(72px, 2fr) 3fr;
        gap: 8px;
        align-items: center;
      }
      h3 {
        margin: 4px 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink2);
      }
      small {
        font-size: 12px;
        color: var(--ink2);
      }
      small a {
        color: inherit;
      }

      input,
      button {
        font: inherit;
        color: inherit;
        border: 0;
        border-radius: 6px;
        background: var(--field);
        padding: 4px 8px;
        width: 100%;
        min-width: 0;
        min-height: 28px;
      }
      input:hover,
      button:not(:disabled):hover {
        background: var(--field-h);
      }
      input[type="number"] {
        font-family: var(--mono);
        text-align: center;
      }
      input[type="color"] {
        flex: none;
        width: 24px;
        height: 24px;
        min-height: 0;
        padding: 0;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 1px var(--line);
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: inherit;
      }
      input[type="color"]::-moz-color-swatch {
        border: 0;
        border-radius: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 1px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .primary {
        background: var(--blue);
        color: #fff;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 120, 200, 0.3);
      }
      .primary:hover:not(:disabled) {
        background: var(--blue-h);
      }

      .drop input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .drop {
        position: relative;
        display: block;
        padding: 16px;
        text-align: center;
        border: 2px dashed var(--line);
        border-radius: 10px;
        color: var(--ink2);
        cursor: pointer;
      }
      .drop:hover,
      .drop:focus-within {
        border-color: var(--blue);
        color: var(--ink);
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
        gap: 4px;
      }
      .swatches > input[type="color"] {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        border-radius: 6px;
      }

      .note {
        margin: 0;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 13px;
      }
      .note.error {
        background: var(--error);
        color: var(--error-ink);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="preview" id="preview" aria-live="polite">
        <img id="image-preview" alt="Source image" hidden />
        <p class="empty" id="empty">Choose an image to extract its colors.</p>
      </div>

      <form id="form" method="post" enctype="multipart/form-data">
        <div class="panel">
          <h3>Source</h3>
          <label class="drop"
            >Drop an image or <u>browse</u
            ><input id="image" type="file" name="image" accept="image/*"
          /></label>
          <p class="note error" id="image-error" role="alert" hidden>
            That file couldn't be read as an image. Try a PNG, JPEG, or WebP.
          </p>
          <label class="row"
            >Colors
            <input id="count" type="number" name="count" min="1" max="24" step="1" value="6"
          /></label>
        </div>

        <div class="panel">
          <h3>Palette</h3>
          <div class="swatches" id="palette"></div>
          <small id="palette-help">Colors appear here after you choose an image.</small>
        </div>

        <button id="save" type="submit" class="primary" disabled>Save</button>
        <small>
          Based on
          <a href="http://gfx.cs.princeton.edu/pubs/Chang_2015_PPR/chang2015-palette_small.pdf"
            >Palette-Based Photo Recoloring (Chang et al. 2015)</a
          >, section 3.2, via Google's
          <a href="https://github.com/googleartsculture/art-palette/tree/master/palette-extraction"
            >Art Palette</a
          >.
        </small>
      </form>
    </div>
    <canvas id="canvas" hidden></canvas>

    <script>
      // Adapted from Google's Art Palette palette_extractor.min.js.
      const arrayUtils = {
        clone: (d) => (d.length ? Array.from(d) : []),
        repeat: (d, e) => Array(e).fill(d),
      };

      const vec3Utils = {
        add: (d, e, f) => {
          f[0] = d[0] + e[0];
          f[1] = d[1] + e[1];
          f[2] = d[2] + e[2];
          return f;
        },
        scale: (d, e, f) => {
          f[0] = d[0] * e;
          f[1] = d[1] * e;
          f[2] = d[2] * e;
          return f;
        },
        distanceSquared: (d, e) => {
          const a = d[0] - e[0],
            b = d[1] - e[1],
            c = d[2] - e[2];
          return a * a + b * b + c * c;
        },
        createFloat32FromArray: (d) => new Float32Array(d),
      };

      class PaletteExtractor {
        constructor() {
          this.labs_ = [];
          this.weights_ = [];
          this.seeds_ = [];
          this.seedWeights_ = [];
        }

        processImageData(data, count = 5) {
          this.computeHistogramFromImageData_(data);
          this.selectSeeds_(count);
          this.clusterColors_();
          return this.exportPalette_();
        }

        computeHistogramFromImageData_(data) {
          this.labs_ = [];
          this.weights_ = arrayUtils.repeat(0, PaletteExtractor.HISTOGRAM_SIZE_);
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i],
              g = data[i + 1],
              b = data[i + 2];
            const lab = vec3Utils.createFloat32FromArray(this.rgbToLab(r, g, b));
            const bin = 16 * (16 * Math.floor(r / 16) + Math.floor(g / 16)) + Math.floor(b / 16);
            if (bin in this.labs_) vec3Utils.add(this.labs_[bin], lab, this.labs_[bin]);
            else this.labs_[bin] = lab;
            this.weights_[bin]++;
          }
        }

        selectSeeds_(count) {
          this.seeds_ = [];
          const weights = arrayUtils.clone(this.weights_);
          let index = 0;
          for (
            let i = 0;
            i < count && ((index = this.getHeaviestIndex_(weights)), weights[index] !== 0);
            ++i
          ) {
            const seed = this.addSeedByIndex_(index);
            weights[index] = 0;
            this.attenuateWeightsAroundSeed_(weights, seed);
          }
        }

        clusterColors_() {
          if (!this.seeds_.length) throw Error("Please select seeds before clustering");
          const assignments = arrayUtils.repeat(0, PaletteExtractor.HISTOGRAM_SIZE_);
          let sums = [];
          this.seedWeights_ = [];
          let done = false;
          while (!done) {
            done = true;
            sums = [];
            this.seedWeights_ = arrayUtils.repeat(0, this.seeds_.length);
            for (let i = 0; i < PaletteExtractor.HISTOGRAM_SIZE_; i++) {
              if (this.weights_[i] !== 0) {
                const closest = this.getClosestSeedIndex_(i);
                if (done && closest !== assignments[i]) done = false;
                assignments[i] = closest;
                this.addColorToSeed_(sums, closest, i);
              }
            }
            this.updateSeedsWithNewSeeds_(sums);
          }
        }

        exportPalette_() {
          if (!this.seeds_.length)
            throw Error("Please select seeds and get clusters before exporting a new palette");
          return this.seeds_.map((seed) => {
            const rgb = this.labToRgb(seed[0], seed[1], seed[2]);
            return this.rgbToHex(rgb[0], rgb[1], rgb[2]);
          });
        }

        attenuateWeightsAroundSeed_(weights, seed) {
          for (let i = 0; i < PaletteExtractor.HISTOGRAM_SIZE_; i++) {
            if (this.weights_[i] > 0) {
              const point = vec3Utils.createFloat32FromArray([0, 0, 0]);
              vec3Utils.scale(this.labs_[i], 1 / this.weights_[i], point);
              weights[i] *= 1 - Math.exp(-vec3Utils.distanceSquared(seed, point) / 3650);
            }
          }
        }

        addSeedByIndex_(index) {
          const seed = vec3Utils.createFloat32FromArray([0, 0, 0]);
          vec3Utils.scale(this.labs_[index], 1 / this.weights_[index], seed);
          this.seeds_.push(seed);
          return seed;
        }

        getHeaviestIndex_(weights) {
          let max = 0,
            index = 0;
          for (let i = 0; i < PaletteExtractor.HISTOGRAM_SIZE_; i++) {
            if (weights[i] > max) {
              max = weights[i];
              index = i;
            }
          }
          return index;
        }

        addColorToSeed_(sums, seedIndex, binIndex) {
          if (!(seedIndex in sums)) sums[seedIndex] = vec3Utils.createFloat32FromArray([0, 0, 0]);
          vec3Utils.add(sums[seedIndex], this.labs_[binIndex], sums[seedIndex]);
          this.seedWeights_[seedIndex] += this.weights_[binIndex];
        }

        updateSeedsWithNewSeeds_(sums) {
          for (let i = 0; i < this.seeds_.length; i++) {
            if (!(i in sums)) sums[i] = vec3Utils.createFloat32FromArray([0, 0, 0]);
            if (this.seedWeights_[i] === 0) sums[i] = vec3Utils.createFloat32FromArray([0, 0, 0]);
            else vec3Utils.scale(sums[i], 1 / this.seedWeights_[i], sums[i]);
            this.seeds_[i] = new Float32Array(sums[i]);
          }
        }

        getClosestSeedIndex_(binIndex) {
          const point = new Float32Array(this.labs_[binIndex]);
          vec3Utils.scale(point, 1 / this.weights_[binIndex], point);
          let closest = Number.MAX_SAFE_INTEGER,
            index = 0;
          for (let i = 0; i < this.seeds_.length; i++) {
            const distance = vec3Utils.distanceSquared(this.seeds_[i], point);
            if (distance < closest) {
              closest = distance;
              index = i;
            }
          }
          return index;
        }

        componentToHex(value) {
          const hex = value.toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        }

        rgbToHex(r, g, b) {
          r = +r;
          g = +g;
          b = +b;
          if (r !== (255 & r) || g !== (255 & g) || b !== (255 & b)) {
            throw Error("Invalid RGB color");
          }
          return "#" + this.componentToHex(r) + this.componentToHex(g) + this.componentToHex(b);
        }

        rgbToLab(r, g, b) {
          return this.xyzToLab(...this.rgbToXyz(r / 255, g / 255, b / 255));
        }

        labToRgb(l, a, b) {
          const xyz = this.labToXyz(l, a, b);
          const rgb = this.xyzToRgb(...xyz);
          return rgb.map((v) => Math.min(255, Math.max(0, Math.round(255 * v))));
        }

        xyzToRgb(x, y, z) {
          x /= 100;
          y /= 100;
          z /= 100;
          let r = 3.2406 * x - 1.5372 * y - 0.4986 * z;
          let g = -0.9689 * x + 1.8758 * y + 0.0415 * z;
          let b = 0.0557 * x - 0.204 * y + 1.057 * z;
          r = 0.0031308 < r ? 1.055 * Math.pow(r, 1 / 2.4) - 0.055 : 12.92 * r;
          g = 0.0031308 < g ? 1.055 * Math.pow(g, 1 / 2.4) - 0.055 : 12.92 * g;
          b = 0.0031308 < b ? 1.055 * Math.pow(b, 1 / 2.4) - 0.055 : 12.92 * b;
          return [r, g, b];
        }

        labToXyz(l, a, b) {
          const f = (l + 16) / 116;
          return [
            PaletteExtractor.REF_X * Math.pow(f + a / 500, 3),
            PaletteExtractor.REF_Y * Math.pow(f, 3),
            PaletteExtractor.REF_Z * Math.pow(f - b / 200, 3),
          ];
        }

        xyzToLab(x, y, z) {
          const xr = x / PaletteExtractor.REF_X,
            yr = y / PaletteExtractor.REF_Y,
            zr = z / PaletteExtractor.REF_Z;
          return [
            0.008856 < yr ? 116 * Math.pow(yr, 1 / 3) - 16 : 903.3 * yr,
            500 * (this.transformation(xr) - this.transformation(yr)),
            200 * (this.transformation(yr) - this.transformation(zr)),
          ];
        }

        rgbToXyz(r, g, b) {
          r = 0.04045 < r ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
          g = 0.04045 < g ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
          b = 0.04045 < b ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
          r *= 100;
          g *= 100;
          b *= 100;
          return [
            0.4124 * r + 0.3576 * g + 0.1805 * b,
            0.2126 * r + 0.7152 * g + 0.0722 * b,
            0.0193 * r + 0.1192 * g + 0.9505 * b,
          ];
        }

        transformation(value) {
          return 0.008856 < value ? Math.pow(value, 1 / 3) : 7.787 * value + 16 / 116;
        }
      }

      PaletteExtractor.HISTOGRAM_SIZE_ = 4096;
      PaletteExtractor.REF_X = 95.047;
      PaletteExtractor.REF_Y = 100;
      PaletteExtractor.REF_Z = 108.883;

      const form = document.getElementById("form");
      const imageInput = document.getElementById("image");
      const countInput = document.getElementById("count");
      const previewElement = document.getElementById("preview");
      const emptyElement = document.getElementById("empty");
      const imagePreview = document.getElementById("image-preview");
      const paletteElement = document.getElementById("palette");
      const paletteHelp = document.getElementById("palette-help");
      const imageError = document.getElementById("image-error");
      const canvas = document.getElementById("canvas");
      const saveButton = document.getElementById("save");

      const paletteExtractor = new PaletteExtractor();
      let colors = [];
      let imageData = null;
      let inputFileReader = null;

      function makePreviewImage(palette) {
        const size = 64;
        const width = size * palette.length;
        const rects = palette
          .map(
            (color, i) =>
              '<rect x="' +
              i * size +
              '" y="0" width="' +
              size +
              '" height="' +
              size +
              '" fill="' +
              color +
              '"/>',
          )
          .join("");
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="' +
          width +
          '" height="' +
          size +
          '" viewBox="0 0 ' +
          width +
          " " +
          size +
          '">' +
          rects +
          "</svg>";
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }

      // Palette swatches are editable color inputs (repeated name="colors").
      function renderPalette() {
        paletteElement.innerHTML = "";
        colors.forEach((color, i) => {
          const swatch = document.createElement("input");
          swatch.type = "color";
          swatch.name = "colors";
          swatch.value = color;
          swatch.title = color;
          swatch.setAttribute("aria-label", "Palette color " + (i + 1));
          swatch.addEventListener("input", () => {
            colors[i] = swatch.value;
            swatch.title = swatch.value;
          });
          paletteElement.appendChild(swatch);
        });
        paletteHelp.textContent = colors.length
          ? "Click a color to adjust it."
          : "Colors appear here after you choose an image.";
        saveButton.disabled = colors.length === 0;
      }

      function extractPalette() {
        if (!imageData) return;
        const count = Math.max(1, Math.min(24, Number(countInput.value) || 6));
        countInput.value = count;
        colors = paletteExtractor.processImageData(imageData.data, count);
        renderPalette();
      }

      function setBusy(busy) {
        if (busy) previewElement.setAttribute("aria-busy", "true");
        else previewElement.removeAttribute("aria-busy");
        saveButton.disabled = busy || colors.length === 0;
      }

      function showImageError() {
        imageError.hidden = false;
        setBusy(false);
      }

      function loadImage(file) {
        if (inputFileReader) inputFileReader.abort();
        imageError.hidden = true;
        setBusy(true);
        inputFileReader = new FileReader();
        inputFileReader.onload = (event) => {
          const image = new Image();
          image.onload = () => {
            if (image.naturalWidth < 1 || image.naturalHeight < 1) return showImageError();
            setBusy(false);
            const scale = Math.min(1, 400 / image.naturalWidth);
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            imagePreview.src = event.target.result;
            imagePreview.hidden = false;
            emptyElement.hidden = true;
            extractPalette();
          };
          image.onerror = () => showImageError();
          image.src = event.target.result;
        };
        inputFileReader.onerror = () => showImageError();
        inputFileReader.readAsDataURL(file);
      }

      imageInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) loadImage(file);
        imageInput.value = "";
      });

      countInput.addEventListener("change", extractPalette);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!colors.length) return;
        const value = {
          count: colors.length,
          colors,
          _previewImage: makePreviewImage(colors),
        };
        cuttle.setValueAndClose(value);
        imageData = null;
        if (inputFileReader) inputFileReader.abort();
        inputFileReader = null;
        imagePreview.removeAttribute("src");
        imagePreview.hidden = true;
        emptyElement.hidden = false;
      });

      cuttle.ready((value) => {
        if (!value) return;
        if (value.count) countInput.value = value.count;
        if (Array.isArray(value.colors)) {
          colors = value.colors;
          renderPalette();
        }
      });
    </script>
  </body>
</html>
