<!DOCTYPE html>
<html>
<head>
  <title>OpenStreetMap Place Picker</title>

  <script src="https://cuttle.xyz/editor/customizer/v1.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      color: #222;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .search {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      padding: 8px 12px;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      font-size: 12px;
      color: #666;
      margin: 8px 0;
      min-height: 16px;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .result {
      text-align: left;
      background: #f2f2f2;
      color: #222;
      width: 100%;
    }

    .result:hover {
      background: #ddd;
    }

    #map {
      width: 100%;
      height: 300px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }

    .coordinates {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f5f5f5;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    #save {
      margin-top: 15px;
      width: 100%;
    }

    .attribution {
      margin-top: 8px;
      font-size: 10px;
      color: #777;
    }
  </style>
</head>

<body>
  <label for="query">Place</label>

  <div class="search">
    <input
      id="query"
      type="text"
      placeholder="Search for a place..."
      autocomplete="off"
    >
    <button id="search">Search</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>
  <div id="map"></div>

  <div
    id="coordinates"
    class="coordinates"
    style="display:none"
  ></div>

  <button id="save">Save</button>

  <div class="attribution">
    Map © OpenStreetMap contributors · Leaflet
  </div>

<script>
  let map = null;
  let marker = null;

  // Full-precision authoritative coordinates.
  let latitude = null;
  let longitude = null;

  const $ = id => document.getElementById(id);

  /*
   * Convert decimal degrees to DMS.
   * Seconds are rounded to whole numbers.
   */
  function decimalToDMS(value, positive, negative) {
    const direction = value >= 0 ? positive : negative;
    const absolute = Math.abs(value);

    let degrees = Math.floor(absolute);

    const minutesFloat = (absolute - degrees) * 60;
    let minutes = Math.floor(minutesFloat);

    let seconds = Math.round(
      (minutesFloat - minutes) * 60
    );

    // Carry 60 seconds into minutes.
    if (seconds === 60) {
      seconds = 0;
      minutes++;

      if (minutes === 60) {
        minutes = 0;
        degrees++;
      }
    }

    return {
      direction,
      degrees,
      minutes,
      seconds
    };
  }

  function formatCoordinate(value, positive, negative) {
    const dms = decimalToDMS(value, positive, negative);

    return (
      `${dms.direction} ` +
      `${dms.degrees}° ` +
      `${dms.minutes}' ` +
      `${dms.seconds}"`
    );
  }

  function updateCoordinateDisplay() {
    if (latitude === null || longitude === null) {
      $("coordinates").style.display = "none";
      return;
    }

    $("coordinates").style.display = "block";

    $("coordinates").innerHTML =
      `<div>Latitude: ${formatCoordinate(
        latitude, "N", "S"
      )}</div>` +
      `<div>Longitude: ${formatCoordinate(
        longitude, "E", "W"
      )}</div>`;
  }

  function ensureMap() {
    if (map) return;

    $("map").style.display = "block";

    map = L.map("map");

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    // Clicking the map moves the marker there.
    map.on("click", event => {
      setLocation(
        event.latlng.lat,
        event.latlng.lng,
        false
      );
    });
  }

  function setLocation(lat, lon, moveMap = true) {
    latitude = Number(lat);
    longitude = Number(lon);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {
      return;
    }

    ensureMap();

    const position = [latitude, longitude];

    if (!marker) {
      marker = L.marker(position, {
        draggable: true
      }).addTo(map);

      marker.on("dragend", () => {
        const position = marker.getLatLng();

        latitude = position.lat;
        longitude = position.lng;

        updateCoordinateDisplay();

        $("status").textContent =
          "Drag the marker to fine-tune the location.";
      });
    } else {
      marker.setLatLng(position);
    }

    if (moveMap) {
      map.setView(position, 16);
    }

    updateCoordinateDisplay();
  }

  async function searchPlaces() {
    const query = $("query").value.trim();

    if (!query) return;

    $("search").disabled = true;
    $("status").textContent = "Searching...";
    $("results").replaceChildren();

    try {
      const url =
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({
          q: query,
          format: "jsonv2",
          limit: "5",
          addressdetails: "1"
        });

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const places = await response.json();

      if (!places.length) {
        $("status").textContent = "No places found.";
        return;
      }

      $("status").textContent =
        `${places.length} result` +
        `${places.length === 1 ? "" : "s"}:`;

      for (const place of places) {
        const button = document.createElement("button");

        button.className = "result";
        button.textContent = place.display_name;

        button.onclick = () => {
          const lat = Number(place.lat);
          const lon = Number(place.lon);

          $("query").value = query;

          setLocation(lat, lon, true);

          $("results").replaceChildren();

          $("status").textContent =
            "Drag the marker to fine-tune the location.";
        };

        $("results").appendChild(button);
      }
    } catch (error) {
      console.error(error);

      $("status").textContent =
        "Search failed. Please try again.";
    } finally {
      $("search").disabled = false;
    }
  }

  /*
   * Restore from decimal coordinates only.
   * DMS is never parsed.
   */
  cuttle.ready(value => {
    if (!value) return;

    $("query").value = value.query ?? "";

    const lat = Number(value.latitude);
    const lon = Number(value.longitude);

    if (
      Number.isFinite(lat) &&
      Number.isFinite(lon)
    ) {
      setTimeout(() => {
        setLocation(lat, lon, true);

        map.invalidateSize();

        $("status").textContent =
          "Drag the marker to fine-tune the location.";
      }, 0);
    }
  });

  $("search").onclick = searchPlaces;

  $("query").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      searchPlaces();
    }
  });

  $("save").onclick = () => {
    if (latitude === null || longitude === null) {
      $("status").textContent =
        "Please search for a place or choose a location on the map.";
      return;
    }

    const lat = decimalToDMS(latitude, "N", "S");
    const lon = decimalToDMS(longitude, "E", "W");

    const value = {
      query: $("query").value,

      // Authoritative full-precision coordinates.
      latitude: latitude,
      longitude: longitude,

      // Derived DMS representation.
      direction1: lat.direction,
      degrees1: lat.degrees,
      minsec1: `${lat.minutes}' ${lat.seconds}"`,

      direction2: lon.direction,
      degrees2: lon.degrees,
      minsec2: `${lon.minutes}' ${lon.seconds}"`
    };

    cuttle.setValueAndClose(value);
  };
</script>

</body>
</html>
