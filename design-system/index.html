<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>Cuttle Plugin Style: iframe sizes</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #eee;
    color: rgba(0, 0, 0, 0.85);
    font:
      14px/1.4 system-ui,
      -apple-system,
      sans-serif;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
  }
  p {
    margin: 0 0 24px;
    color: rgba(0, 0, 0, 0.5);
  }
  a {
    color: hsl(200, 100%, 40%);
  }
  .frames {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
  }
  figure {
    margin: 0;
  }
  figcaption {
    margin-bottom: 6px;
    font:
      12px ui-monospace,
      Menlo,
      monospace;
    color: rgba(0, 0, 0, 0.5);
  }
  .frame {
    resize: both;
    overflow: hidden;
    max-width: calc(100vw - 48px);
    border-radius: 10px;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.1),
      0 4px 16px rgba(0, 0, 0, 0.08);
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
<h1>Cuttle plugin style</h1>
<p>
  One file,
  <a href="./cuttle-plugin-design-system.html">cuttle-plugin-design-system.html</a>, shown at three
  iframe sizes. Drag a corner to resize a frame. View the file's source for the rules.
</p>
<div class="frames">
  <figure>
    <figcaption>Narrow · 320 × 640</figcaption>
    <div class="frame" style="width: 320px; height: 640px">
      <iframe src="./cuttle-plugin-design-system.html" title="Narrow"></iframe>
    </div>
  </figure>
  <figure>
    <figcaption>Breakpoint · 720 × 640</figcaption>
    <div class="frame" style="width: 720px; height: 640px">
      <iframe src="./cuttle-plugin-design-system.html" title="Breakpoint"></iframe>
    </div>
  </figure>
  <figure>
    <figcaption>Wide and short · 1040 × 440</figcaption>
    <div class="frame" style="width: 1040px; height: 440px">
      <iframe src="./cuttle-plugin-design-system.html" title="Wide and short"></iframe>
    </div>
  </figure>
</div>
