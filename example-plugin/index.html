<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!--
A minimal Cuttle parameter plugin: one input, an SVG preview, and a Save button.
Plugin docs: https://github.com/forresto/demo-cuttle-plugins
-->

<title>Star</title>

<!-- Parameter plugin docs: https://cuttle.xyz/learn/parameter-plugins -->
<script src="https://cuttle.xyz/parameter-plugin/v1.js"></script>
<link rel="stylesheet" href="https://cuttle.xyz/parameter-plugin/v1.css" />

<style>
  .preview svg {
    width: 80%;
    height: 80%;
  }
  /* Preview only: keep the hairline visible on screen at any physical size. */
  .preview svg path {
    vector-effect: non-scaling-stroke;
    stroke-width: 1.5px;
  }
</style>

<div class="layout">
  <div class="preview"></div>
  <div class="controls">
    <div class="panel">
      <label class="row"
        >Points <input type="number" name="points" value="5" min="3" max="108" step="1"
      /></label>
      <output></output>
      <button type="button" class="primary">Save</button>
    </div>
  </div>
</div>

<script type="module">
  // The SVG is 2 in (50.8 mm) square. Its width/height are in mm with the same
  // numbers in the viewBox, so coordinates and the stroke width are in mm.
  const SIZE = 50.8;
  // Cuttle's hairline stroke width (0.01 in) in mm; a blue hairline is a score line.
  const HAIRLINE = 0.254;
  const pointsInput = document.querySelector('[name="points"]');
  const fmt = (v) => String(Math.round(v * 1000) / 1000);
  const clampPoints = (points) => Math.min(108, Math.max(3, Math.round(points) || 5));

  // A star as score lines: n points on a circle, each joined to the point
  // nearly opposite.
  function starSvg(n) {
    const r = SIZE / 2;
    const pt = (i) => {
      const a = (i / n) * 2 * Math.PI - Math.PI / 2;
      return `${fmt(r + r * Math.cos(a))} ${fmt(r + r * Math.sin(a))}`;
    };
    const step = Math.floor((n - 1) / 2);
    let d = "";
    for (let i = 0; i < n; i++) d += `M${pt(i)}L${pt(i + step)}`;
    return (
      `<svg xmlns="http://www.w3.org/2000/svg" width="${SIZE}mm" height="${SIZE}mm" viewBox="0 0 ${SIZE} ${SIZE}">` +
      `<path fill="none" stroke="#0000ff" stroke-width="${HAIRLINE}" d="${d}"/></svg>`
    );
  }

  // The value saved to Cuttle. `_text` and `_image` are its preview.
  function readValue() {
    const points = clampPoints(Number(pointsInput.value));
    return {
      points,
      _text: `${points}-point star`,
      _image: cuttle.svgDataUrl(starSvg(points)),
    };
  }

  function render() {
    const { points, _text } = readValue();
    document.querySelector(".preview").innerHTML = starSvg(points);
    document.querySelector("output").textContent = _text;
  }
  pointsInput.addEventListener("input", render);
  render();

  cuttle.ready((value = {}) => {
    pointsInput.value = clampPoints(value.points ?? 5);
    render();
  });

  document.querySelector(".primary").addEventListener("click", () => {
    cuttle.setValueAndClose(readValue());
  });
</script>
