<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>Cuttle Plugin Style</title>
<script src="https://cuttle.xyz/parameter-plugin/v1.js"></script>
<!--
CUTTLE PLUGIN STYLE: a starting point, not a rulebook. A plugin is just a web page, so do
whatever its UX needs (full-width preview, no preview, custom controls). Borrow what helps.

- Will render in an iframe of any size, 300px to full screen: 1 column narrow, 2 wide, avoid sideways scroll.
- Labeled, named controls.
- Labels and controls use a grid; stack rows when the iframe is narrow.
- White bordered text fields, useful placeholders, and a 16px base UI.
- One output raft groups the value being saved with the explicit "Save" button.primary.
- Blue is for actions and focus; the design's own colors go in the content.
- SVG output has physical width/height, a matching viewBox, and laser color and stroke width from cuttle.laser (blue hairline = score).
- Do what Cuttle can't (search, analysis, simulation); leave the rest to Cuttle (icons, fonts, modifiers).
- System font, native inputs, prefer vanilla JS.

Plugin docs: https://github.com/forresto/demo-cuttle-plugins
-->
<style>
  :root {
    --bg: #fafafa;
    --panel: #f3f3f3;
    --field: #e6e6e6;
    --field-h: #dedede;
    --ink: rgba(0, 0, 0, 0.85);
    --ink2: rgba(0, 0, 0, 0.6);
    --line: rgba(0, 0, 0, 0.1);
    --field-border: rgba(0, 0, 0, 0.25);
    --blue: hsl(200, 100%, 50%);
    --blue-h: hsl(200, 100%, 58%);
    --accent: hsl(262, 80%, 64%);
    --warn: hsl(42, 100%, 88%);
    --error: hsl(0, 70%, 92%);
    --error-ink: hsl(12, 68%, 40%);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--ink);
    font:
      16px/1.4 system-ui,
      -apple-system,
      sans-serif;
  }

  .layout {
    display: grid;
    gap: 12px;
    align-items: start;
  }
  @media (min-width: 640px) {
    .layout {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
  }
  @media (min-width: 1000px) {
    .layout {
      grid-template-columns: minmax(0, 1fr) 420px;
    }
  }

  .preview {
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 4/3;
    min-height: 200px;
    max-height: calc(100vh - 24px);
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px var(--line),
      0 4px 16px rgba(0, 0, 0, 0.08);
    background: #fff;
  }
  .preview > img,
  .preview > canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .preview > .fill {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .preview svg {
    width: 80%;
    height: 80%;
  }
  /* Preview only: keep the hairline visible on screen at any physical size. */
  .preview svg path {
    vector-effect: non-scaling-stroke;
    stroke-width: 1.5px;
  }
  .empty {
    color: var(--ink2);
    text-align: center;
    padding: 24px;
  }
  .preview[aria-busy="true"] {
    opacity: 0.6;
  }
  /* After the base .preview rule, or position: relative wins. */
  @media (min-width: 640px) {
    .preview {
      position: sticky;
      top: 12px;
    }
  }

  .controls {
    display: grid;
    gap: 12px;
    min-width: 0;
    container-type: inline-size;
  }
  .panel,
  details > div {
    display: grid;
    gap: 8px;
  }
  .panel {
    background: var(--panel);
    border-radius: 10px;
    padding: 12px;
  }
  .row {
    display: grid;
    grid-template-columns: minmax(72px, 2fr) minmax(0, 3fr);
    gap: 8px;
    align-items: center;
  }
  @container (max-width: 360px) {
    .row {
      grid-template-columns: minmax(0, 1fr);
      gap: 4px;
    }
  }
  .pair {
    display: flex;
    gap: 4px;
    align-items: center;
    min-width: 0;
  }
  .pair select,
  .pair button {
    flex: none;
    width: auto;
  }
  h3 {
    margin: 4px 0 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink2);
  }
  small {
    font-size: 14px;
    color: var(--ink2);
  }
  small a {
    color: inherit;
  }
  output {
    font-family: var(--mono);
  }

  input,
  select,
  button {
    font: inherit;
    color: inherit;
    border: 0;
    border-radius: 6px;
    background: var(--field);
    padding: 4px 8px;
    width: 100%;
    min-width: 0;
    min-height: 36px;
  }
  input[type="text"] {
    background: #fff;
    border: 1px solid var(--field-border);
  }
  input[type="text"]:hover {
    background: #fff;
  }
  input:hover,
  select:hover,
  button:not(:disabled):hover {
    background: var(--field-h);
  }
  input[type="number"] {
    font-family: var(--mono);
    text-align: center;
  }
  input[type="range"] {
    padding: 0;
    background: none;
    accent-color: var(--blue);
    cursor: pointer;
  }
  input[type="checkbox"] {
    width: 18px;
    min-height: 18px;
    justify-self: start;
    accent-color: var(--blue);
  }
  input[type="color"] {
    flex: none;
    width: 24px;
    height: 24px;
    min-height: 0;
    padding: 0;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }
  input[type="color"]::-webkit-color-swatch {
    border: 0;
    border-radius: inherit;
  }
  input[type="color"]::-moz-color-swatch {
    border: 0;
    border-radius: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .primary {
    background: var(--blue);
    color: #fff;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 120, 200, 0.3);
  }
  .primary:hover:not(:disabled) {
    background: var(--blue-h);
  }

  .seg {
    display: flex;
    padding: 2px;
    gap: 2px;
    background: var(--field);
    border-radius: 6px;
  }
  .seg label {
    position: relative;
    flex: 1;
    text-align: center;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink2);
  }
  .seg input {
    position: absolute;
    inset: 0;
    width: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .seg label:has(:checked) {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  }
  .seg label:has(:focus-visible) {
    outline: 2px solid var(--blue);
  }

  summary {
    background: var(--field);
    border-radius: 6px;
    padding: 4px 8px;
    font-weight: 600;
    color: var(--ink2);
    cursor: pointer;
  }
  details > div {
    margin: 8px 0 0 4px;
    padding-left: 12px;
    border-left: 2px solid var(--line);
  }

  .drop {
    position: relative;
    display: block;
    padding: 16px;
    text-align: center;
    border: 2px dashed var(--line);
    border-radius: 10px;
    color: var(--ink2);
    cursor: pointer;
  }
  .drop:hover,
  .drop:focus-within {
    border-color: var(--blue);
    color: var(--ink);
  }
  .drop input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .swatches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
    gap: 4px;
  }
  .swatches > input[type="color"] {
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    border-radius: 6px;
  }

  .note {
    margin: 0;
    color: var(--ink2);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
  .note.warn,
  .note.error {
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--ink);
  }
  .note.warn {
    background: var(--warn);
  }
  .note.error {
    background: var(--error);
    color: var(--error-ink);
  }
</style>

<div class="layout">
  <div class="preview" aria-live="polite"></div>

  <div class="controls">
    <div class="panel">
      <h3>Group A</h3>
      <label class="row"
        >Text <input type="text" name="text" value="Hello" placeholder="Enter text..."
      /></label>
      <label class="row"
        >Number <input type="number" name="number" value="5" min="5" max="24" step="1"
      /></label>
      <label class="row"
        >Size
        <span class="pair">
          <input type="number" name="size" value="2.00" step="0.01" min="0.1" />
          <select name="size_unit" aria-label="Size unit">
            <option>mm</option>
            <option selected>in</option>
            <option>px</option>
          </select>
        </span>
      </label>
      <label class="row"
        >Range <input type="range" name="range" value="50" min="0" max="100"
      /></label>
      <div class="row">
        <span>Choice</span>
        <span class="seg">
          <label><input type="radio" name="choice" value="a" checked />A</label>
          <label><input type="radio" name="choice" value="b" />B</label>
          <label><input type="radio" name="choice" value="c" />C</label>
        </span>
      </div>

      <details open>
        <summary>Subgroup A</summary>
        <div>
          <label class="row"
            >Toggle <input type="checkbox" name="toggle" value="1" checked
          /></label>
          <label class="row"
            >Select
            <select name="select">
              <option>Option 1</option>
              <option>Option 2</option>
              <option>Option 3</option>
            </select></label
          >
          <label class="row">Color <input type="color" name="color" value="#8b5cf6" /></label>
        </div>
      </details>

      <details>
        <summary>Subgroup B</summary>
        <div>
          <label class="drop"
            >Drop a file or <u>browse</u><input type="file" name="file" accept="image/*"
          /></label>
          <small>Help text goes under the field it explains.</small>
        </div>
      </details>
    </div>

    <div class="panel">
      <h3>Palette controls</h3>
      <div class="swatches">
        <input type="color" name="palette" value="#222222" aria-label="Palette color 1" />
        <input type="color" name="palette" value="#8b5cf6" aria-label="Palette color 2" />
        <input type="color" name="palette" value="#f472b6" aria-label="Palette color 3" />
        <input type="color" name="palette" value="#fbbf24" aria-label="Palette color 4" />
        <input type="color" name="palette" value="#ffffff" aria-label="Palette color 5" />
      </div>
      <p class="note warn">Warnings sit next to the field that caused them.</p>
    </div>

    <div class="panel">
      <h3>Output</h3>
      <output id="value-summary"></output>
      <button type="button" class="primary">Save</button>
    </div>

    <small>Credits and sources go here.</small>
  </div>
</div>
<script>
  // The design is a reference, not a required layout. Keep this lifecycle when
  // adapting the page into a Cuttle input plugin.
  // The units cuttle.laser understands, minus pt.
  const UNITS = ["mm", "in", "px"];
  const field = (name) => document.querySelector(`[name="${name}"]`);
  const fmt = (v) => String(Math.round(v * 1000) / 1000);

  // A star as score lines: n points on a circle, each joined to the point
  // nearly opposite, for the sharpest star. The viewBox matches width/height,
  // so coordinates are in the chosen unit and cuttle.laser.hairline(unit) is
  // the score line's stroke width.
  function starSvg(points, size, unit) {
    const n = Math.min(24, Math.max(5, Math.round(points) || 5));
    const r = size / 2;
    const pt = (i) => {
      const a = (i / n) * 2 * Math.PI - Math.PI / 2;
      return `${fmt(r + r * Math.cos(a))} ${fmt(r + r * Math.sin(a))}`;
    };
    const step = Math.floor((n - 1) / 2);
    let d = "";
    for (let i = 0; i < n; i++) d += `M${pt(i)}L${pt(i + step)}`;
    const s = fmt(size);
    return (
      `<svg xmlns="http://www.w3.org/2000/svg" width="${s}${unit}" height="${s}${unit}" viewBox="0 0 ${s} ${s}">` +
      `<path fill="none" stroke="${cuttle.laser.colors.score}" stroke-width="${cuttle.laser.hairline(unit)}" d="${d}"/></svg>`
    );
  }

  // The value saved to Cuttle. The SVG goes in _image only; don't also save
  // it under another key.
  function readValue() {
    const number = Math.min(24, Math.max(5, Math.round(Number(field("number").value)) || 5));
    const size = Math.max(0.1, Number(field("size").value) || 2);
    const unit = field("size_unit").value;
    return {
      text: field("text").value,
      number,
      size,
      unit,
      range: Number(field("range").value),
      _text: `${number}-point star · ${fmt(size)} ${unit}`,
      _image: "data:image/svg+xml," + encodeURIComponent(starSvg(number, size, unit)),
    };
  }

  function render() {
    const { number, size, unit, _text } = readValue();
    document.querySelector(".preview").innerHTML = starSvg(number, size, unit);
    document.getElementById("value-summary").textContent = _text;
  }
  document.querySelector(".controls").addEventListener("input", render);
  render();

  if (window.cuttle) {
    cuttle.ready((value = {}) => {
      field("text").value = value.text ?? "Hello";
      field("number").value = value.number ?? 5;
      field("size").value = value.size ?? "2.00";
      if (UNITS.includes(value.unit)) field("size_unit").value = value.unit;
      field("range").value = value.range ?? 50;
      render();
    });

    document.querySelector(".primary").addEventListener("click", () => {
      cuttle.setValueAndClose(readValue());
    });
  }
</script>
