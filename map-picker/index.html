<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Map Picker</title>

    <script src="https://cuttle.xyz/editor/customizer/v1.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      /* Cuttle plugin design system (2026-09-25), only the parts this plugin uses. */
      :root {
        --bg: #fafafa;
        --panel: #f3f3f3;
        --field: #e6e6e6;
        --field-h: #dedede;
        --ink: rgba(0, 0, 0, 0.85);
        --ink2: rgba(0, 0, 0, 0.5);
        --line: rgba(0, 0, 0, 0.1);
        --blue: hsl(200, 100%, 50%);
        --blue-h: hsl(200, 100%, 58%);
        --error: hsl(0, 70%, 92%);
        --error-ink: hsl(12, 68%, 40%);
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.4 system-ui,
          -apple-system,
          sans-serif;
      }

      .layout {
        display: grid;
        gap: 12px;
        align-items: start;
      }
      .preview {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 4/3;
        min-height: 200px;
        max-height: calc(100vh - 24px);
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--line),
          0 4px 16px rgba(0, 0, 0, 0.08);
        background: #fff;
      }
      .empty {
        color: var(--ink2);
        text-align: center;
        padding: 24px;
      }

      /* Media queries sit after .preview so sticky beats position: relative. */
      @media (min-width: 640px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        /* Full height beside the controls, so the map shows context around the design. */
        .preview {
          position: sticky;
          top: 12px;
          aspect-ratio: auto;
          height: calc(100vh - 24px);
        }
      }
      @media (min-width: 1000px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) 420px;
        }
      }

      .controls {
        display: grid;
        gap: 12px;
      }
      .panel,
      details > div {
        display: grid;
        gap: 8px;
      }
      .panel {
        background: var(--panel);
        border-radius: 10px;
        padding: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(72px, 2fr) 3fr;
        gap: 8px;
        align-items: center;
      }
      .pair {
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .pair select,
      .pair button {
        flex: none;
        width: auto;
      }
      h3 {
        margin: 4px 0 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink2);
      }
      small {
        font-size: 12px;
        color: var(--ink2);
      }

      input,
      select,
      button {
        font: inherit;
        color: inherit;
        border: 0;
        border-radius: 6px;
        background: var(--field);
        padding: 4px 8px;
        width: 100%;
        min-width: 0;
        min-height: 28px;
      }
      input:hover,
      select:hover,
      button:not(:disabled):hover {
        background: var(--field-h);
      }
      input[type="number"] {
        font-family: var(--mono);
        text-align: center;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 1px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .primary {
        background: var(--blue);
        color: #fff;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 120, 200, 0.3);
      }
      .primary:hover:not(:disabled) {
        background: var(--blue-h);
      }

      .seg {
        display: flex;
        padding: 2px;
        gap: 2px;
        background: var(--field);
        border-radius: 6px;
      }
      .seg label {
        position: relative;
        flex: 1;
        text-align: center;
        padding: 2px 6px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--ink2);
      }
      .seg input {
        position: absolute;
        inset: 0;
        width: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .seg label:has(:checked) {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .seg label:has(:focus-visible) {
        outline: 2px solid var(--blue);
      }

      summary {
        background: var(--field);
        border-radius: 6px;
        padding: 4px 8px;
        font-weight: 600;
        color: var(--ink2);
        cursor: pointer;
      }
      details > div {
        margin: 8px 0 0 4px;
        padding-left: 12px;
        border-left: 2px solid var(--line);
      }

      .note {
        margin: 0;
        padding: 8px 10px;
        border-radius: 6px;
        background: #fff;
        box-shadow: inset 0 0 0 1px var(--line);
        font-size: 13px;
      }
      .note.error {
        background: var(--error);
        color: var(--error-ink);
      }

      /* Plugin-specific additions. */
      #map {
        display: none;
        position: absolute;
        inset: 0;
        isolation: isolate;
      }
      /* The design area, inset in the map. Lives inside the map container, above the
         tile and overlay panes but below Leaflet's controls; the shadow dims the context. */
      #frame {
        position: absolute;
        z-index: 700;
        pointer-events: none;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 0 100vmax rgba(250, 250, 250, 0.45);
      }
      /* The generated SVG sits on a white wash so the vectors read over the tiles. */
      .leaflet-image-layer.vectors {
        background: rgba(255, 255, 255, 0.85);
      }
      #status:empty,
      #searchStatus:empty,
      #results:empty {
        display: none;
      }
      #results {
        display: grid;
        gap: 4px;
      }
      #results button {
        text-align: left;
      }
      .times {
        flex: none;
        color: var(--ink2);
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <div id="preview" class="preview">
        <div id="map" aria-label="Map"></div>
        <p id="empty" class="empty">Search for a place to show the map.</p>
      </div>

      <!-- autocomplete off on each control so a reload does not restore stale state. -->
      <div class="controls">
        <div class="panel">
          <h3>Location</h3>

          <div class="row">
            <label for="query">Place</label>
            <span class="pair">
              <input
                id="query"
                name="query"
                type="text"
                placeholder="Address, city, or ZIP..."
                autocomplete="off"
              />
              <button id="search" type="button">Search</button>
            </span>
          </div>

          <p id="searchStatus" class="note" aria-live="polite"></p>
          <div id="results"></div>

          <label class="row"
            >Area width
            <span class="pair">
              <input
                id="area"
                name="area"
                type="number"
                value="2"
                min="0"
                step="any"
                autocomplete="off"
              />
              <select id="areaUnit" name="areaUnit" aria-label="Area unit" autocomplete="off">
                <option selected>mi</option>
                <option>km</option>
              </select>
            </span>
          </label>
          <small>Pan and scroll the map to frame the area.</small>
        </div>

        <div class="panel">
          <h3>Design</h3>

          <div class="row">
            <span>Aspect ratio</span>
            <span class="pair">
              <input
                id="width"
                name="width"
                type="number"
                value="4"
                min="0"
                step="any"
                aria-label="Aspect width"
                autocomplete="off"
              />
              <span class="times">:</span>
              <input
                id="height"
                name="height"
                type="number"
                value="3"
                min="0"
                step="any"
                aria-label="Aspect height"
                autocomplete="off"
              />
            </span>
          </div>

          <div class="row">
            <span>Detail</span>
            <span class="seg">
              <label><input type="radio" name="detail" value="light" autocomplete="off" />Light</label>
              <label><input type="radio" name="detail" value="medium" checked autocomplete="off" />Medium</label>
              <label><input type="radio" name="detail" value="high" autocomplete="off" />High</label>
            </span>
          </div>

          <details id="layers">
            <summary>Layers</summary>
            <!-- One row per category, built from CATEGORIES. -->
            <div id="layerRows"></div>
          </details>
          <p id="status" class="note" aria-live="polite"></p>
        </div>

        <button id="save" type="button" class="primary" disabled>Save</button>

        <small>Map data © OpenStreetMap contributors, ODbL · Leaflet</small>
      </div>
    </div>

    <script type="module">
      import * as Clipper2 from "https://cdn.jsdelivr.net/npm/clipper2-ts@2.0.1-18/+esm";

      const $ = (id) => document.getElementById(id);
      const detailRadio = (selector) =>
        document.querySelector(`input[name="detail"]${selector}`);

      // The template decides the output size; geometry is simplified as if the
      // longer side were this many millimeters, and the SVG is in those units.
      const NOMINAL_SIZE_MM = 180;
      const KM_PER_MILE = 1.609344;
      const EARTH_CIRCUMFERENCE_KM = 40075.016686;

      /*
       * Laser operations, in Cuttle's colors. "fill" engraves the area itself
       * and is only offered for area categories.
       */
      const OPERATIONS = {
        off: { label: "Off" },
        cut: { label: "Cut", color: "#ff0000" },
        score: { label: "Score", color: "#0000ff" },
        engrave: { label: "Engrave", color: "#000000" },
        fill: { label: "Engrave fill", color: "#000000" },
      };

      // Listed in panel order. `width` is the engrave line width in millimeters,
      // `limit` caps the count after decluttering (buildings use the detail setting).
      const CATEGORIES = [
        { id: "majorRoads", label: "Major roads", op: "score", width: 0.4, limit: 150 },
        { id: "minorRoads", label: "Local roads", op: "score", width: 0.3, limit: 650 },
        { id: "paths", label: "Paths", op: "off", width: 0.2, limit: 650 },
        { id: "railways", label: "Railways", op: "score", width: 0.3, limit: 150 },
        { id: "water", label: "Water", area: true, op: "engrave", width: 0.3, limit: 250 },
        // Centerlines stop at the shore of water areas, unless Water is off.
        { id: "waterways", label: "Rivers & streams", op: "score", width: 0.3, limit: 250 },
        { id: "buildings", label: "Buildings", area: true, op: "score", width: 0.2 },
        { id: "parks", label: "Parks & woods", area: true, op: "off", width: 0.2, limit: 250 },
        { id: "border", label: "Border", op: "cut", width: 0.2 },
      ];
      const categoryById = Object.fromEntries(
        CATEGORIES.map((category) => [category.id, category]),
      );

      const allowedOps = (category) =>
        Object.keys(OPERATIONS).filter((op) => op !== "fill" || category.area);

      // Shortbread `streets` kinds; anything else (runways, unknown kinds) is dropped.
      const STREET_CATEGORY = {};
      for (const [id, kinds] of Object.entries({
        majorRoads: "motorway trunk primary secondary tertiary",
        minorRoads: "unclassified residential living_street service pedestrian busway",
        paths: "track footway steps path cycleway",
        railways: "rail narrow_gauge tram light_rail subway funicular monorail",
      })) {
        for (const kind of kinds.split(" ")) STREET_CATEGORY[kind] = id;
      }
      const PARK_KINDS = new Set(["park", "forest", "wood", "grass", "meadow", "golf_course"]);

      let map = null;
      let overlay = null;

      // The chosen place; its center moves as the map is panned.
      let placeName = "";

      // The SVG data URL of the most recent render, or null while rendering.
      let svgUrl = null;

      // Bumped on every change so stale renders are dropped.
      let generation = 0;
      let renderTimer = null;

      const kmPerAreaUnit = () => ($("areaUnit").value === "mi" ? KM_PER_MILE : 1);

      function setStatus(message, error = false, id = "status") {
        $(id).textContent = message;
        $(id).classList.toggle("error", error);
      }

      const setSearchStatus = (message, error = false) => setStatus(message, error, "searchStatus");

      /*
       * Nominal design size from the aspect ratio, or null if the fields are invalid.
       */
      function readSize() {
        const aspect = Number($("width").value) / Number($("height").value);
        if (!(aspect >= 0.1 && aspect <= 10)) return null;
        return aspect >= 1
          ? { width: NOMINAL_SIZE_MM, height: NOMINAL_SIZE_MM / aspect }
          : { width: NOMINAL_SIZE_MM * aspect, height: NOMINAL_SIZE_MM };
      }

      /*
       * The design area is inset in the map, fit to the design's aspect ratio.
       */
      const FRAME_INSET = 24;
      let frameAspect = 4 / 3;

      function frameSize() {
        const width = $("preview").clientWidth - 2 * FRAME_INSET;
        const height = $("preview").clientHeight - 2 * FRAME_INSET;
        return width / height > frameAspect
          ? { width: height * frameAspect, height }
          : { width, height: width / frameAspect };
      }

      function updateFrame() {
        const size = readSize();
        if (size) frameAspect = size.width / size.height;
        if (!map) return;
        const frame = frameSize();
        Object.assign($("frame").style, {
          left: `${($("preview").clientWidth - frame.width) / 2}px`,
          top: `${($("preview").clientHeight - frame.height) / 2}px`,
          width: `${frame.width}px`,
          height: `${frame.height}px`,
        });
      }

      /*
       * Create the Leaflet map on first use.
       */
      function ensureMap() {
        if (map) return;

        $("map").style.display = "block";
        $("empty").hidden = true;

        // Fractional zoom so the area width can be any value.
        map = L.map("map", { zoomSnap: 0, zoomDelta: 0.5, wheelPxPerZoomLevel: 120 });

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);

        // Show the fast raster map while moving; render vectors once it settles.
        map.on("movestart", clearVectors);
        map.on("moveend", () => {
          updateAreaField();
          scheduleRender();
        });

        const frame = document.createElement("div");
        frame.id = "frame";
        map.getContainer().append(frame);

        new ResizeObserver(() => {
          map.invalidateSize({ animate: false });
          keepArea();
        }).observe($("preview"));
      }

      function zoomForArea(areaKm, lat) {
        const worldKm = EARTH_CIRCUMFERENCE_KM * Math.cos((lat * Math.PI) / 180);
        return Math.log2((frameSize().width * worldKm) / (areaKm * 256));
      }

      /*
       * Refit the frame, zooming so it still spans the area width in the field.
       */
      function keepArea() {
        updateFrame();
        const areaKm = Number($("area").value) * kmPerAreaUnit();
        if (!map || !(areaKm > 0)) return;
        map.setZoom(zoomForArea(areaKm, map.getCenter().lat), { animate: false });
      }

      function showLocation(lat, lon, areaKm) {
        ensureMap();
        map.invalidateSize();
        updateFrame();
        map.setView([lat, lon], zoomForArea(areaKm, lat), { animate: false });
      }

      /*
       * The framed region, in normalized Web Mercator world coordinates (0-1).
       */
      function currentView() {
        const frame = frameSize();
        const zoom = map.getZoom();
        const worldPx = 256 * 2 ** zoom;
        const center = map.getCenter();
        const centerPx = map.project(center, zoom);
        const worldWidth = frame.width / worldPx;
        const worldHeight = frame.height / worldPx;
        const kmPerWorld = EARTH_CIRCUMFERENCE_KM * Math.cos((center.lat * Math.PI) / 180);
        return {
          lat: center.lat,
          lon: center.lng,
          cx: centerPx.x / worldPx,
          cy: centerPx.y / worldPx,
          worldWidth,
          worldHeight,
          widthKm: worldWidth * kmPerWorld,
          heightKm: worldHeight * kmPerWorld,
        };
      }

      function updateAreaField() {
        if (!map || document.activeElement === $("area")) return;
        $("area").value = formatNumber(currentView().widthKm / kmPerAreaUnit());
      }

      function clearVectors() {
        generation++;
        clearTimeout(renderTimer);
        if (overlay) overlay.remove();
        overlay = null;
        svgUrl = null;
        $("save").disabled = true;
      }

      function scheduleRender() {
        clearVectors();
        if (!map) return;
        renderTimer = setTimeout(renderVectors, 300);
      }

      /*
       * Fetch vector tiles for the framed region, simplify them to laser-ready
       * paths, and lay the resulting SVG over the map in place.
       */
      async function renderVectors() {
        const run = ++generation;
        const size = readSize();
        if (!size) {
          setStatus("Aspect ratio must be between 1:10 and 10:1.", true);
          return;
        }
        const view = currentView();
        const plan = planTiles(view, Math.max(view.widthKm, view.heightKm));
        if (!plan) {
          setStatus("Zoom in to render the map. The area is too large for vector detail.");
          return;
        }

        const detail = detailRadio(":checked").value;
        const ops = readOps();

        setStatus("Loading map data...");
        try {
          const data = await fetchMapData(plan, () => run !== generation);
          if (run !== generation) return;

          const geometry = buildGeometry(data, view, size, detail, ops);
          const svg = renderSvg(geometry, size, ops);
          svgUrl = "data:image/svg+xml," + encodeURIComponent(svg);

          const bounds = L.latLngBounds(
            worldToLatLng(view.cx - view.worldWidth / 2, view.cy + view.worldHeight / 2),
            worldToLatLng(view.cx + view.worldWidth / 2, view.cy - view.worldHeight / 2),
          );
          overlay = L.imageOverlay(svgUrl, bounds, { className: "vectors" }).addTo(map);
          $("save").disabled = false;

          const counts = CATEGORIES.filter(
            (category) => category.id !== "border" && ops[category.id] !== "off",
          ).map((category) => {
            const { lines, rings, fills } = geometry.categories[category.id];
            return `${category.label} ${lines.length + rings.length + fills.length}`;
          });
          setStatus(
            (counts.length ? counts.join(", ") + " " : "") +
              `(${Math.round(svg.length / 1024)} KB).` +
              (geometry.limited ? " Dense geometry was thinned to stay laser-friendly." : "") +
              (data.buildingsOmitted && ops.buildings !== "off"
                ? " Zoom in to include buildings."
                : ""),
          );
        } catch (error) {
          if (run !== generation) return;
          console.error(error);
          setStatus(error.message || "Map data failed to load.", true);
        }
      }

      function worldToLatLng(x, y) {
        return L.latLng(
          (Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180) / Math.PI,
          x * 360 - 180,
        );
      }

      /*
       * Search OpenStreetMap / Nominatim.
       */
      async function searchPlaces() {
        const query = $("query").value.trim();
        if (!query) return;

        $("search").disabled = true;
        setSearchStatus("Searching...");
        $("results").replaceChildren();

        try {
          const url =
            "https://nominatim.openstreetmap.org/search?" +
            new URLSearchParams({ q: query, format: "jsonv2", limit: "5", addressdetails: "1" });

          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const places = await response.json();
          if (!places.length) {
            setSearchStatus("No places found.");
            return;
          }

          setSearchStatus(`${places.length} result${places.length === 1 ? "" : "s"}:`);

          for (const place of places) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = place.display_name;
            button.onclick = () => {
              placeName = place.display_name;
              $("results").replaceChildren();
              setSearchStatus("");
              $("query").focus();
              const areaKm = Number($("area").value) * kmPerAreaUnit() || 3;
              showLocation(Number(place.lat), Number(place.lon), areaKm);
            };
            $("results").appendChild(button);
          }
        } catch (error) {
          console.error(error);
          setSearchStatus("Search failed. Please try again.", true);
        } finally {
          $("search").disabled = false;
        }
      }

      /*
       * Vector tiles, decoded and kept in a small LRU cache so parameter
       * changes re-render without refetching.
       */
      const TILE_CACHE_SIZE = 100;
      const tileCache = new Map();

      // Be gentle with the OpenStreetMap tile service: few tiles per render,
      // few requests at a time, and nothing new once a render is stale.
      const MAX_TILES = 24;
      const MAX_CONCURRENT_TILES = 4;

      function cachedTile(key) {
        const tile = tileCache.get(key);
        if (tile) {
          tileCache.delete(key);
          tileCache.set(key, tile);
        }
        return tile;
      }

      async function fetchTile(zoom, x, y) {
        const n = 2 ** zoom;
        const wrappedX = ((x % n) + n) % n;
        const url = `https://vector.openstreetmap.org/shortbread_v1/${zoom}/${wrappedX}/${y}.mvt`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Map tile request failed (${response.status})`);
        const elements = decodeVectorTile(
          new Uint8Array(await response.arrayBuffer()),
          { x, y },
          zoom,
          zoom === 14,
        );
        tileCache.set(`${zoom}/${x}/${y}`, elements);
        while (tileCache.size > TILE_CACHE_SIZE) {
          tileCache.delete(tileCache.keys().next().value);
        }
        return elements;
      }

      /*
       * Pick the most detailed tile zoom whose tiles cover the view within
       * MAX_TILES, or null if even the coarsest zoom needs more.
       */
      function planTiles(view, areaKm) {
        const preferred = areaKm <= 6 ? 14 : areaKm > 40 ? 11 : areaKm > 12 ? 12 : 13;
        for (let zoom = preferred; zoom >= 11; zoom--) {
          const n = 2 ** zoom;
          const minX = Math.floor((view.cx - view.worldWidth / 2) * n);
          const maxX = Math.floor((view.cx + view.worldWidth / 2) * n);
          const minY = Math.max(0, Math.floor((view.cy - view.worldHeight / 2) * n));
          const maxY = Math.min(n - 1, Math.floor((view.cy + view.worldHeight / 2) * n));
          if ((maxX - minX + 1) * (maxY - minY + 1) > MAX_TILES) continue;
          const tiles = [];
          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) tiles.push({ x, y });
          }
          return { zoom, tiles };
        }
        return null;
      }

      async function fetchMapData(plan, isStale) {
        const { zoom, tiles } = plan;
        const results = tiles.map(({ x, y }) => cachedTile(`${zoom}/${x}/${y}`));
        const missing = tiles.filter((tile, index) => !results[index]);
        let next = 0;
        let loaded = tiles.length - missing.length;
        let failed = false;

        async function worker() {
          while (next < missing.length && !failed && !isStale()) {
            const tile = missing[next++];
            try {
              results[tiles.indexOf(tile)] = await fetchTile(zoom, tile.x, tile.y);
            } catch (error) {
              failed = true;
              throw error;
            }
            loaded++;
            if (!isStale()) setStatus(`Loading map data (${loaded} of ${tiles.length})...`);
          }
        }

        await Promise.all(
          Array.from({ length: Math.min(MAX_CONCURRENT_TILES, missing.length) }, worker),
        );
        return { elements: results.flat(), buildingsOmitted: zoom !== 14 };
      }

      /*
       * Decode a Mapbox Vector Tile into { category, points, ring? } elements,
       * with points in normalized world coordinates. Area rings are kept whole,
       * tile seams and buffer included, so neighboring pieces merge later.
       */
      function decodeVectorTile(bytes, tile, zoom, includeBuildings) {
        const reader = new ProtoReader(bytes);
        const layers = [];
        while (!reader.done()) {
          const tag = reader.varint();
          const field = Math.floor(tag / 8);
          const wire = tag % 8;
          if (field === 3) layers.push(parseVectorLayer(reader.bytesValue()));
          else reader.skip(wire);
        }
        const n = 2 ** zoom;
        const elements = [];
        for (const layer of layers) {
          const toWorld = ([x, y]) => [
            (tile.x + x / layer.extent) / n,
            (tile.y + y / layer.extent) / n,
          ];
          for (const feature of layer.features) {
            const { kind, tunnel } = feature.properties;
            let category = null;
            if (feature.type === 2) {
              if (layer.name === "streets") category = STREET_CATEGORY[kind];
              else if (layer.name === "water_lines") category = "waterways";
              // Rail tunnels are mostly subways; they are not on the surface.
              if (category === "railways" && tunnel) category = null;
            } else if (feature.type === 3) {
              if (layer.name === "ocean" || layer.name === "water_polygons") category = "water";
              else if (layer.name === "land" && PARK_KINDS.has(kind)) category = "parks";
              else if (includeBuildings && layer.name === "buildings") category = "buildings";
            }
            if (!category) continue;
            for (const path of decodeMvtGeometry(feature.geometry)) {
              if (path.length < 2) continue;
              const element = { category, points: path.map(toWorld) };
              if (feature.type === 3) element.ring = true;
              else if (kind === "service") element.minimumLength = 3;
              elements.push(element);
            }
          }
        }
        return elements;
      }

      class ProtoReader {
        constructor(bytes) {
          this.data = bytes;
          this.position = 0;
        }

        done() {
          return this.position >= this.data.length;
        }

        varint() {
          let value = 0;
          let shift = 0;
          let byte;
          do {
            byte = this.data[this.position++];
            if (byte === undefined) throw new Error("Invalid vector tile");
            value += (byte & 0x7f) * 2 ** shift;
            shift += 7;
          } while (byte & 0x80);
          return value;
        }

        bytesValue() {
          const length = this.varint();
          const result = this.data.subarray(this.position, this.position + length);
          this.position += length;
          return result;
        }

        float32() {
          const view = new DataView(this.data.buffer, this.data.byteOffset + this.position, 4);
          this.position += 4;
          return view.getFloat32(0, true);
        }

        float64() {
          const view = new DataView(this.data.buffer, this.data.byteOffset + this.position, 8);
          this.position += 8;
          return view.getFloat64(0, true);
        }

        skip(wire) {
          if (wire === 0) this.varint();
          else if (wire === 1) this.position += 8;
          else if (wire === 2) {
            const length = this.varint();
            this.position += length;
          } else if (wire === 5) this.position += 4;
          else throw new Error(`Unsupported vector tile wire type ${wire}`);
        }
      }

      function parseVectorLayer(bytes) {
        const reader = new ProtoReader(bytes);
        const layer = { name: "", extent: 4096, keys: [], values: [], rawFeatures: [] };
        while (!reader.done()) {
          const tag = reader.varint();
          const field = Math.floor(tag / 8);
          const wire = tag % 8;
          if (field === 1) layer.name = new TextDecoder().decode(reader.bytesValue());
          else if (field === 2) layer.rawFeatures.push(reader.bytesValue());
          else if (field === 3) layer.keys.push(new TextDecoder().decode(reader.bytesValue()));
          else if (field === 4) layer.values.push(parseMvtValue(reader.bytesValue()));
          else if (field === 5) layer.extent = reader.varint();
          else reader.skip(wire);
        }
        layer.features = layer.rawFeatures.map((feature) =>
          parseMvtFeature(feature, layer.keys, layer.values),
        );
        return layer;
      }

      function parseMvtValue(bytes) {
        const reader = new ProtoReader(bytes);
        let value = null;
        while (!reader.done()) {
          const tag = reader.varint();
          const field = Math.floor(tag / 8);
          const wire = tag % 8;
          if (field === 1) value = new TextDecoder().decode(reader.bytesValue());
          else if (field === 2) value = reader.float32();
          else if (field === 3) value = reader.float64();
          else if (field === 4 || field === 5) value = reader.varint();
          else if (field === 6) {
            const encoded = reader.varint();
            value = (encoded >>> 1) ^ -(encoded & 1);
          } else if (field === 7) value = Boolean(reader.varint());
          else reader.skip(wire);
        }
        return value;
      }

      function parseMvtFeature(bytes, keys, values) {
        const reader = new ProtoReader(bytes);
        const feature = { type: 0, properties: {}, geometry: new Uint8Array() };
        let tags = [];
        while (!reader.done()) {
          const tag = reader.varint();
          const field = Math.floor(tag / 8);
          const wire = tag % 8;
          if (field === 2) {
            const packed = new ProtoReader(reader.bytesValue());
            while (!packed.done()) tags.push(packed.varint());
          } else if (field === 3) feature.type = reader.varint();
          else if (field === 4) feature.geometry = reader.bytesValue();
          else reader.skip(wire);
        }
        for (let index = 0; index < tags.length; index += 2) {
          feature.properties[keys[tags[index]]] = values[tags[index + 1]];
        }
        return feature;
      }

      function decodeMvtGeometry(bytes) {
        const reader = new ProtoReader(bytes);
        const paths = [];
        let x = 0;
        let y = 0;
        while (!reader.done()) {
          const commandLength = reader.varint();
          const command = commandLength & 0x7;
          const count = commandLength >> 3;
          if (command === 1 || command === 2) {
            for (let index = 0; index < count; index++) {
              const dx = reader.varint();
              const dy = reader.varint();
              x += (dx >>> 1) ^ -(dx & 1);
              y += (dy >>> 1) ^ -(dy & 1);
              if (command === 1) paths.push([[x, y]]);
              else if (paths.length) paths.at(-1).push([x, y]);
            }
          } else if (command === 7 && paths.length) {
            const path = paths.at(-1);
            if (path.length && distance(path[0], path.at(-1)) > 0) path.push([...path[0]]);
          } else {
            throw new Error(`Unsupported vector tile geometry command ${command}`);
          }
        }
        return paths;
      }

      /*
       * Project, clip, simplify, and declutter the map data into design space:
       * millimeters, centered on the origin, y pointing down.
       */
      function buildGeometry(data, view, size, detail, ops) {
        const { width, height } = size;
        const scale = width / view.worldWidth;
        const xLimit = width / 2;
        const yLimit = height / 2;
        // Tolerances and spacings in millimeters.
        const settings = {
          high: {
            roadTolerance: 0.1,
            polygonTolerance: 0.08,
            minArea: 0.35,
            maxBuildings: 2200,
            lineSpacing: 0.55,
            lineNovelty: 0.18,
            buildingSpacing: 0.5,
            waterSpacing: 0.35,
          },
          medium: {
            roadTolerance: 0.18,
            polygonTolerance: 0.12,
            minArea: 0.65,
            maxBuildings: 1600,
            lineSpacing: 0.9,
            lineNovelty: 0.25,
            buildingSpacing: 1,
            waterSpacing: 0.45,
          },
          light: {
            roadTolerance: 0.3,
            polygonTolerance: 0.2,
            minArea: 1.2,
            maxBuildings: 900,
            lineSpacing: 1.8,
            lineNovelty: 0.45,
            buildingSpacing: 2.2,
            waterSpacing: 0.75,
          },
        }[detail];
        const categories = {};
        for (const category of CATEGORIES) {
          categories[category.id] = { lines: [], rings: [], fills: [] };
        }
        // Building outlines stay grouped per building until they are decluttered.
        const buildings = [];

        const project = ([x, y]) => ({ x: (x - view.cx) * scale, y: (y - view.cy) * scale });
        const frameRect = { left: -xLimit, top: -yLimit, right: xLimit, bottom: yLimit };
        const inFrame = ({ x, y }) => Math.abs(x) <= xLimit && Math.abs(y) <= yLimit;
        const addLines = (target, paths, tolerance, minimumLength) => {
          for (const path of paths) {
            const points = fromPathD(Clipper2.ramerDouglasPeuckerD(path, tolerance));
            if (points.length >= 2 && polylineLength(points) >= minimumLength) {
              target.push(roundPoints(points));
            }
          }
        };
        // Shapes fully in the frame stay closed; the rest become open lines
        // with no edges along the frame.
        const addOutline = (target, path, tolerance, minimumLength) => {
          if (path.every(inFrame)) {
            const ring = Clipper2.simplifyPathD(path, tolerance, true);
            if (ring.length >= 3) target.rings.push(roundPoints(fromPathD(ring)));
            return;
          }
          // Start outside the frame, so no visible piece is split at the start.
          const start = path.findIndex((point) => !inFrame(point));
          const open = [...path.slice(start), ...path.slice(0, start + 1)];
          addLines(
            target.lines,
            Clipper2.rectClipLines(frameRect, open, PRECISION),
            tolerance,
            minimumLength,
          );
        };

        // Area rings per category, and lines per category and minimum length.
        const areaRings = { water: [], parks: [], buildings: [] };
        const lineGroups = new Map();
        for (const element of data.elements) {
          if (ops[element.category] === "off") continue;
          const path = element.points.map(project);
          if (element.ring) {
            if (path.length >= 3) areaRings[element.category].push(path);
            continue;
          }
          const minimumLength = element.minimumLength ?? 1;
          const key = `${element.category} ${minimumLength}`;
          if (!lineGroups.has(key)) {
            lineGroups.set(key, { category: element.category, minimumLength, paths: [] });
          }
          lineGroups.get(key).paths.push(path);
        }

        let waterUnion = [];
        for (const [id, rings] of Object.entries(areaRings)) {
          if (!rings.length) continue;
          // Tile pieces, seams and buffers included, merge into whole shapes.
          // Holes keep their opposite winding, so the nonzero rule leaves them open.
          const merged = Clipper2.unionD(rings, [], Clipper2.FillRule.NonZero, PRECISION);
          if (id === "water") waterUnion = merged;
          const target = categories[id];
          if (ops[id] === "fill") {
            // Closed along the frame: those edges bound the filled region.
            for (const path of Clipper2.rectClip(frameRect, merged, PRECISION)) {
              const points = Clipper2.simplifyPathD(path, settings.polygonTolerance, true);
              const area = Math.abs(Clipper2.areaD(points));
              if (points.length >= 3 && area >= settings.minArea) {
                target.fills.push({ points: roundPoints(fromPathD(points)), area });
              }
            }
          } else if (id === "buildings") {
            for (const path of merged) {
              const visible = path.every(inFrame)
                ? [path]
                : Clipper2.rectClip(frameRect, path, PRECISION);
              const area = visible.reduce((sum, part) => sum + Math.abs(Clipper2.areaD(part)), 0);
              if (area < settings.minArea) continue;
              const building = { points: visible.flatMap(fromPathD), area, lines: [], rings: [] };
              addOutline(building, path, settings.polygonTolerance, 0);
              buildings.push(building);
            }
          } else {
            for (const path of merged) addOutline(target, path, settings.roadTolerance, 1);
          }
        }

        for (const { category, minimumLength, paths } of lineGroups.values()) {
          let clipped = Clipper2.rectClipLines(frameRect, paths, PRECISION);
          if (category === "waterways" && waterUnion.length) {
            // Streams stop at the shore instead of running down the middle of
            // rivers and lakes. With Water off, the centerline is all there is.
            const clipper = new Clipper2.ClipperD(PRECISION);
            clipper.addOpenSubjectPaths(clipped);
            clipper.addClipPaths(waterUnion);
            clipped = [];
            clipper.execute(Clipper2.ClipType.Difference, Clipper2.FillRule.NonZero, [], clipped);
          }
          addLines(categories[category].lines, clipped, settings.roadTolerance, minimumLength);
        }

        let limited = false;
        // Earlier categories claim space first.
        const declutter = (ids, spacing, novelty) => {
          let occupied = new Set();
          for (const id of ids) {
            const lines = categories[id].lines;
            lines.sort((a, b) => polylineLength(b) - polylineLength(a));
            const result = declutterLines(lines, spacing, novelty, occupied);
            limited ||= result.lines.length < lines.length;
            categories[id].lines = result.lines;
            occupied = result.occupied;
          }
        };
        declutter(
          ["majorRoads", "minorRoads", "paths", "railways"],
          settings.lineSpacing,
          settings.lineNovelty,
        );
        declutter(["water", "waterways"], settings.waterSpacing, 0.18);
        declutter(["parks"], settings.waterSpacing, 0.18);

        buildings.sort((a, b) => b.area - a.area);
        const spacedBuildings = declutterBuildings(buildings, settings.buildingSpacing);
        limited ||=
          spacedBuildings.length < buildings.length ||
          spacedBuildings.length > settings.maxBuildings;
        for (const building of spacedBuildings.slice(0, settings.maxBuildings)) {
          categories.buildings.lines.push(...building.lines);
          categories.buildings.rings.push(...building.rings);
        }

        for (const category of CATEGORIES) {
          const limit = category.limit ?? settings.maxBuildings;
          const target = categories[category.id];
          if (target.lines.length > limit || target.fills.length > limit) limited = true;
          if (category.id !== "buildings") target.lines = target.lines.slice(0, limit);
          target.fills = target.fills
            .sort((a, b) => b.area - a.area)
            .slice(0, limit)
            .map((polygon) => polygon.points);
        }

        return { categories, limited };
      }

      /*
       * Cuttle operation colors: red = cut, blue = score, black = engrave.
       * Fills first, then outlines and lines, then the border on top.
       */
      function renderSvg(geometry, size, ops) {
        const { width, height } = size;
        const pathData = (lines, closed) =>
          lines
            .map(
              (points) =>
                `M${points.map((point) => point.join(" ")).join("L")}${closed ? "Z" : ""}`,
            )
            .join("");
        const x = formatNumber(-width / 2);
        const y = formatNumber(-height / 2);
        const strokeWidth = (id) =>
          ops[id] === "engrave" ? categoryById[id].width : id === "buildings" ? 0.15 : 0.2;
        const paths = [];
        for (const id of ["water", "parks", "buildings"]) {
          const { fills } = geometry.categories[id];
          if (ops[id] === "fill" && fills.length) {
            paths.push(`<path fill="#000000" stroke="none" d="${pathData(fills, true)}"/>`);
          }
        }
        for (const id of [
          "water",
          "parks",
          "buildings",
          "waterways",
          "paths",
          "railways",
          "minorRoads",
          "majorRoads",
        ]) {
          const { lines, rings } = geometry.categories[id];
          if (ops[id] === "off" || ops[id] === "fill" || !(lines.length || rings.length)) continue;
          paths.push(
            `<path stroke="${OPERATIONS[ops[id]].color}" stroke-width="${strokeWidth(id)}" ` +
              `d="${pathData(rings, true)}${pathData(lines, false)}"/>`,
          );
        }
        if (ops.border !== "off") {
          paths.push(
            `<rect stroke="${OPERATIONS[ops.border].color}" stroke-width="${strokeWidth("border")}" ` +
              `x="${x}" y="${y}" width="${formatNumber(width)}" height="${formatNumber(height)}"/>`,
          );
        }
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${formatNumber(width)}" height="${formatNumber(height)}" viewBox="${x} ${y} ${formatNumber(width)} ${formatNumber(height)}">
<!-- Map data © OpenStreetMap contributors, ODbL 1.0 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
${paths.join("\n")}
</g>
</svg>`;
      }

      // Clipper2 works on { x, y } points, rounded to this many decimals (millimeters).
      const PRECISION = 3;

      function fromPathD(path) {
        return path.map(({ x, y }) => [x, y]);
      }

      function distance(a, b) {
        return Math.hypot(a[0] - b[0], a[1] - b[1]);
      }

      function polylineLength(points) {
        let length = 0;
        for (let i = 0; i < points.length - 1; i++) length += distance(points[i], points[i + 1]);
        return length;
      }

      function declutterLines(lines, cellSize, minimumNovelty, occupied = new Set()) {
        const kept = [];
        for (const line of lines) {
          const cells = polylineCells(line, cellSize);
          let novelCells = 0;
          for (const cell of cells) {
            if (!occupied.has(cell)) novelCells++;
          }
          if (cells.size && novelCells / cells.size < minimumNovelty) continue;
          kept.push(line);
          for (const cell of cells) occupied.add(cell);
        }
        return { lines: kept, occupied };
      }

      function polylineCells(points, cellSize) {
        const cells = new Set();
        for (let index = 0; index < points.length - 1; index++) {
          const start = points[index];
          const end = points[index + 1];
          const length = distance(start, end);
          const steps = Math.max(1, Math.ceil(length / (cellSize * 0.5)));
          for (let step = 0; step <= steps; step++) {
            const ratio = step / steps;
            const x = start[0] + (end[0] - start[0]) * ratio;
            const y = start[1] + (end[1] - start[1]) * ratio;
            cells.add(`${Math.floor(x / cellSize)},${Math.floor(y / cellSize)}`);
          }
        }
        return cells;
      }

      function declutterBuildings(buildings, cellSize) {
        const occupied = new Set();
        const kept = [];
        for (const building of buildings) {
          const center = building.points
            .reduce((sum, point) => [sum[0] + point[0], sum[1] + point[1]], [0, 0])
            .map((value) => value / building.points.length);
          const cell = `${Math.floor(center[0] / cellSize)},${Math.floor(center[1] / cellSize)}`;
          if (occupied.has(cell)) continue;
          occupied.add(cell);
          kept.push(building);
        }
        return kept;
      }

      function roundPoints(points) {
        return points.map(([x, y]) => [formatNumber(x), formatNumber(y)]);
      }

      function formatNumber(value) {
        return Number(value.toFixed(2));
      }

      /*
       * Controls.
       */
      $("search").onclick = searchPlaces;

      $("query").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          searchPlaces();
        } else if (event.key === "ArrowDown" && $("results").firstElementChild) {
          event.preventDefault();
          $("results").firstElementChild.focus();
        }
      });

      // Arrow keys move through the results; Enter chooses (native button behavior).
      $("results").addEventListener("keydown", (event) => {
        const current = event.target.closest("button");
        if (!current) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          current.nextElementSibling?.focus();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          (current.previousElementSibling ?? $("query")).focus();
        } else if (event.key === "Escape") {
          $("results").replaceChildren();
          setSearchStatus("");
          $("query").focus();
        }
      });

      $("area").addEventListener("input", keepArea);
      $("area").addEventListener("blur", updateAreaField);

      for (const id of ["width", "height"]) {
        $(id).addEventListener("input", () => {
          keepArea();
          scheduleRender();
        });
      }

      // Only the display changes; the framed area stays the same.
      $("areaUnit").addEventListener("change", updateAreaField);

      for (const radio of document.querySelectorAll('input[name="detail"]')) {
        radio.addEventListener("change", scheduleRender);
      }

      // One operation select per layer; changes re-render from cached tiles.
      for (const category of CATEGORIES) {
        const row = document.createElement("label");
        row.className = "row";
        const select = document.createElement("select");
        select.id = `layer-${category.id}`;
        select.autocomplete = "off";
        for (const op of allowedOps(category)) {
          select.add(new Option(OPERATIONS[op].label, op, false, op === category.op));
        }
        select.addEventListener("change", scheduleRender);
        row.append(category.label, select);
        $("layerRows").append(row);
      }

      const layerSelect = (id) => $(`layer-${id}`);

      function readOps() {
        return Object.fromEntries(CATEGORIES.map(({ id }) => [id, layerSelect(id).value]));
      }

      /*
       * Save the framing and the rendered vectors. Cuttle imports the SVG from
       * _previewImage; the rest restores the plugin next time.
       */
      $("save").addEventListener("click", () => {
        if (!window.cuttle || !map || !svgUrl) return;
        const view = currentView();
        cuttle.setValueAndClose({
          query: $("query").value,
          location: placeName,
          latitude: view.lat,
          longitude: view.lon,
          areaWidthKm: view.widthKm,
          areaDisplayUnit: $("areaUnit").value,
          aspect: [Number($("width").value), Number($("height").value)],
          detail: detailRadio(":checked").value,
          layers: readOps(),
          _previewText: placeName || `${view.lat.toFixed(4)}, ${view.lon.toFixed(4)}`,
          _previewImage: svgUrl,
        });
      });

      updateFrame();

      /*
       * Restore the plugin from the Cuttle value.
       */
      if (window.cuttle) {
        cuttle.ready((value) => {
          if (!value) return;

          $("query").value = value.query ?? "";
          placeName = value.location ?? "";
          if (["mi", "km"].includes(value.areaDisplayUnit)) {
            $("areaUnit").value = value.areaDisplayUnit;
          }
          const [aspectWidth, aspectHeight] = Array.isArray(value.aspect) ? value.aspect : [];
          if (Number(aspectWidth) > 0 && Number(aspectHeight) > 0) {
            $("width").value = aspectWidth;
            $("height").value = aspectHeight;
          }
          if (["light", "medium", "high"].includes(value.detail)) {
            detailRadio(`[value="${value.detail}"]`).checked = true;
          }
          // Values saved before layers existed keep the defaults.
          for (const category of CATEGORIES) {
            const op = value.layers?.[category.id];
            if (allowedOps(category).includes(op)) layerSelect(category.id).value = op;
          }
          updateFrame();

          const lat = Number(value.latitude);
          const lon = Number(value.longitude);
          const areaKm = Number(value.areaWidthKm);
          if (Number.isFinite(lat) && Number.isFinite(lon)) {
            // Wait until the plugin has rendered before initializing Leaflet.
            setTimeout(() => showLocation(lat, lon, areaKm > 0 ? areaKm : 3), 0);
          }
        });
      }
    </script>
  </body>
</html>
